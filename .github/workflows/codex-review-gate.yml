name: codex-review-gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to re-evaluate
        required: false
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  evaluate:
    name: evaluate codex review gate
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: Check trusted review signal
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumbers = [];

            if (context.eventName === "pull_request_target") {
              prNumbers.push(context.payload.pull_request.number);
            } else if (context.eventName === "issue_comment") {
              prNumbers.push(context.payload.issue.number);
            } else if (context.eventName === "workflow_dispatch") {
              const input = context.payload.inputs?.pr_number;
              if (input) {
                const prNumber = Number.parseInt(input, 10);
                if (!Number.isInteger(prNumber) || prNumber <= 0) {
                  throw new Error(`Invalid pr_number: ${input}`);
                }
                prNumbers.push(prNumber);
              }
            }

            if (context.eventName === "schedule" || prNumbers.length === 0) {
              for (let page = 1; ; page += 1) {
                const { data: pulls } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: "open",
                  per_page: 100,
                  page,
                });
                if (pulls.length === 0) {
                  break;
                }
                for (const pull of pulls) {
                  prNumbers.push(pull.number);
                }
              }
            }

            const CODEX_CONNECTOR_LOGINS = new Set([
              "chatgpt-codex-connector",
              "chatgpt-codex-connector[bot]",
            ]);
            const COPILOT_REVIEWER_LOGINS = new Set([
              "copilot-pull-request-reviewer",
              "copilot-pull-request-reviewer[bot]",
            ]);

            const normalizedLogin = (login) =>
              typeof login === "string" ? login.toLowerCase() : "";
            const isCodexConnector = (login) =>
              CODEX_CONNECTOR_LOGINS.has(normalizedLogin(login));
            const isCopilotReviewer = (login) =>
              COPILOT_REVIEWER_LOGINS.has(normalizedLogin(login));
            const normalizedSha = (sha) =>
              typeof sha === "string" ? sha.toLowerCase() : "";
            const shaMatches = (fullSha, prefix) => {
              const full = normalizedSha(fullSha);
              const candidate = normalizedSha(prefix);
              return Boolean(full && candidate && full.startsWith(candidate));
            };
            const extractReviewSha = (body) => {
              if (typeof body !== "string") {
                return "";
              }
              const match = body.match(/@codex\s+review\s+([0-9a-f]{10,40})/i);
              return match ? match[1].toLowerCase() : "";
            };
            const bodyMentionsSha = (body, sha) => {
              if (typeof body !== "string" || !sha) {
                return false;
              }
              const lowerBody = body.toLowerCase();
              const lowerSha = sha.toLowerCase();
              return (
                lowerBody.includes(lowerSha) ||
                lowerBody.includes(lowerSha.slice(0, 10))
              );
            };
            const hasPassVerdict = (body) =>
              typeof body === "string" &&
              /final verdict[\s\S]{0,200}\bpass\b/i.test(body);
            const hasCleanCodexSignal = (body) =>
              hasPassVerdict(body) ||
              (typeof body === "string" &&
                /didn['’]t find any major issues/i.test(body));
            const reviewIsSubmitted = (review) =>
              Boolean(review?.submitted_at) &&
              String(review?.state || "").toUpperCase() !== "DISMISSED";

            async function listReviewThreads(prNumber) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes {
                              author {
                                login
                              }
                              commit {
                                oid
                              }
                              pullRequestReview {
                                state
                                author {
                                  login
                                }
                                commit {
                                  oid
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`;

              const threads = [];
              let cursor = null;
              for (;;) {
                const result = await github.graphql(query, {
                  owner,
                  repo,
                  number: prNumber,
                  cursor,
                });
                const reviewThreads =
                  result.repository.pullRequest.reviewThreads;
                threads.push(...reviewThreads.nodes);
                if (!reviewThreads.pageInfo.hasNextPage) {
                  break;
                }
                cursor = reviewThreads.pageInfo.endCursor;
              }
              return threads;
            }

            async function evaluatePullRequest(prNumber) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              const headSha = normalizedSha(pull.head.sha);

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                }
              );
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }
              );
              const prCommits = await github.paginate(
                github.rest.pulls.listCommits,
                {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }
              );
              const prCommitShas = prCommits.map((commit) =>
                normalizedSha(commit.sha)
              );
              const shaBelongsToPr = (sha) => {
                const candidate = normalizedSha(sha);
                return (
                  candidate.length >= 10 &&
                  prCommitShas.some((commitSha) =>
                    commitSha.startsWith(candidate)
                  )
                );
              };

              const reviewThreads = await listReviewThreads(prNumber);
              const classifyThread = (thread) => {
                const rootComment = thread.comments.nodes[0];
                const review = rootComment?.pullRequestReview;
                const reviewState = String(review?.state || "").toUpperCase();
                const reviewLogin = review?.author?.login;
                const commentLogin = rootComment?.author?.login;
                const reviewSha =
                  review?.commit?.oid || rootComment?.commit?.oid || "";

                if (
                  reviewState === "DISMISSED" ||
                  !shaBelongsToPr(reviewSha)
                ) {
                  return "other";
                }
                if (
                  isCodexConnector(reviewLogin) ||
                  isCodexConnector(commentLogin)
                ) {
                  return "codex";
                }
                if (
                  isCopilotReviewer(reviewLogin) ||
                  isCopilotReviewer(commentLogin)
                ) {
                  return "copilot";
                }
                return "other";
              };

              const codexThreads = reviewThreads.filter(
                (thread) => classifyThread(thread) === "codex"
              );
              const copilotThreads = reviewThreads.filter(
                (thread) => classifyThread(thread) === "copilot"
              );
              const unresolvedCodexThreads = codexThreads.filter(
                (thread) => !thread.isResolved && !thread.isOutdated
              );
              const unresolvedCopilotThreads = copilotThreads.filter(
                (thread) => !thread.isResolved && !thread.isOutdated
              );
              const unresolvedTrustedThreadCount =
                unresolvedCodexThreads.length +
                unresolvedCopilotThreads.length;

              const validCopilotReviews = reviews.filter(
                (review) =>
                  isCopilotReviewer(review.user?.login) &&
                  reviewIsSubmitted(review) &&
                  shaBelongsToPr(review.commit_id)
              );
              const copilotReviewAccepted = validCopilotReviews.length > 0;

              const validCodexRequests = comments
                .map((comment) => ({
                  comment,
                  requestedSha: extractReviewSha(comment.body),
                }))
                .filter(({ requestedSha }) => shaBelongsToPr(requestedSha))
                .sort(
                  (a, b) =>
                    new Date(
                      b.comment.updated_at || b.comment.created_at
                    ) -
                    new Date(
                      a.comment.updated_at || a.comment.created_at
                    )
                );

              const connectorThumbsUp = async (request) => {
                const reactions = await github.paginate(
                  github.rest.reactions.listForIssueComment,
                  {
                    owner,
                    repo,
                    comment_id: request.id,
                    content: "+1",
                    per_page: 100,
                  }
                );
                const requestUpdatedAt = new Date(
                  request.updated_at || request.created_at
                );
                return reactions.some(
                  (reaction) =>
                    isCodexConnector(reaction.user?.login) &&
                    new Date(reaction.created_at) >= requestUpdatedAt
                );
              };

              let codexReviewAccepted = false;
              for (const { comment: request, requestedSha } of validCodexRequests) {
                const requestAt = new Date(
                  request.updated_at || request.created_at
                );

                if (await connectorThumbsUp(request)) {
                  codexReviewAccepted = true;
                  break;
                }

                const connectorReviews = reviews.filter(
                  (review) =>
                    isCodexConnector(review.user?.login) &&
                    reviewIsSubmitted(review) &&
                    new Date(review.submitted_at) >= requestAt &&
                    shaBelongsToPr(review.commit_id) &&
                    (shaMatches(review.commit_id, requestedSha) ||
                      bodyMentionsSha(review.body, requestedSha))
                );
                const connectorComments = comments.filter(
                  (comment) =>
                    isCodexConnector(comment.user?.login) &&
                    new Date(comment.created_at) >= requestAt &&
                    bodyMentionsSha(comment.body, requestedSha)
                );

                const cleanResponseSeen =
                  connectorReviews.some(
                    (review) =>
                      String(review.state).toUpperCase() === "APPROVED" ||
                      hasCleanCodexSignal(review.body)
                  ) ||
                  connectorComments.some((comment) =>
                    hasCleanCodexSignal(comment.body)
                  );
                const feedbackSeen = connectorReviews.some(
                  (review) =>
                    String(review.state).toUpperCase() !== "APPROVED" &&
                    !hasCleanCodexSignal(review.body)
                );

                if (
                  cleanResponseSeen ||
                  (feedbackSeen &&
                    codexThreads.length > 0 &&
                    unresolvedCodexThreads.length === 0)
                ) {
                  codexReviewAccepted = true;
                  break;
                }
              }

              let state = "failure";
              let provider = "none";
              let description =
                "Complete one Codex or Copilot review for a commit still in this PR.";

              if (unresolvedTrustedThreadCount > 0) {
                description =
                  `Resolve ${unresolvedTrustedThreadCount} active trusted review thread(s).`;
              } else if (codexReviewAccepted) {
                state = "success";
                provider = "Codex";
                description =
                  "Codex review accepted; later PR commits do not require re-review.";
              } else if (copilotReviewAccepted) {
                state = "success";
                provider = "Copilot";
                description =
                  "Copilot review accepted; later PR commits do not require re-review.";
              }

              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state,
                context: "codex-review-gate",
                description,
                target_url: pull.html_url,
              });

              return {
                prNumber,
                url: pull.html_url,
                headSha,
                state,
                provider,
                description,
                codexThreads: codexThreads.length,
                copilotThreads: copilotThreads.length,
              };
            }

            const results = [];
            for (const prNumber of [...new Set(prNumbers)]) {
              results.push(await evaluatePullRequest(prNumber));
            }

            const failed = results.filter(
              (result) => result.state !== "success"
            );
            const table = results.map((result) => [
              `#${result.prNumber}`,
              result.state,
              result.provider,
              result.description,
              result.url,
            ]);
            await core.summary
              .addHeading("Trusted Review Gate")
              .addTable([
                [
                  { data: "PR", header: true },
                  { data: "State", header: true },
                  { data: "Provider", header: true },
                  { data: "Description", header: true },
                  { data: "URL", header: true },
                ],
                ...table,
              ])
              .write();

            if (failed.length > 0 && context.eventName !== "schedule") {
              core.setFailed(
                failed
                  .map(
                    (result) =>
                      `#${result.prNumber}: ${result.description}`
                  )
                  .join("; ")
              );
            }
