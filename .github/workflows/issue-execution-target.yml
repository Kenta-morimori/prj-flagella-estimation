name: issue-execution-target

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: issue-execution-label-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  synchronize-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: target
        run: python3 tools/codex/issue_execution_target.py --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          EXECUTION_LABEL: ${{ steps.target.outputs.label }}
        with:
          script: |
            const label = process.env.EXECUTION_LABEL;
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            };
            const { data: current } = await github.rest.issues.listLabelsOnIssue(
              parameters
            );
            for (const { name } of current) {
              if (name.startsWith("execution:")) {
                await github.rest.issues.removeLabel({ ...parameters, name });
              }
            }
            await github.rest.issues.addLabels({
              ...parameters,
              labels: [label],
            });
