name: issue-execution-target

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  synchronize-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: target
        run: python3 tools/codex/issue_execution_target.py --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          EXECUTION_LABEL: ${{ steps.target.outputs.label }}
        with:
          script: |
            const label = process.env.EXECUTION_LABEL;
            const current = context.payload.issue.labels.map(({ name }) => name);
            const retained = current.filter((name) => !name.startsWith("execution:"));
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [...retained, label],
            });
