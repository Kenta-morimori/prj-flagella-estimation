name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Check deleted issue scripts have no active consumers
        if: github.event_name == 'pull_request'
        run: |
          uv run python tools/codex/check_issue_script_lifecycle.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Test (pytest)
        run: |
          uv run pytest -q || test $? -eq 5
