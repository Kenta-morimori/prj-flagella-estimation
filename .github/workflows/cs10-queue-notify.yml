name: cs10 queue notification

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Queue event that triggered this notification
        required: true
        type: choice
        options: [succeeded, failed, cancelled, queue_completed]
      reservation_id:
        description: Queue reservation identifier, when applicable
        required: false
        type: string
      branch:
        description: Reserved branch ref, when applicable
        required: false
        type: string
      commit_sha:
        description: Reserved commit SHA, when applicable
        required: false
        type: string
      state:
        description: Final reservation state, when applicable
        required: false
        type: string
      logs:
        description: cs10 reservation log directory, when applicable
        required: false
        type: string
      control_dir:
        description: cs10 launcher control directory, when applicable
        required: false
        type: string
      output_root:
        description: Job output root, when applicable
        required: false
        type: string
      error:
        description: Failure detail, when applicable
        required: false
        type: string

permissions: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send queue notification through Gmail SMTP
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          RESERVATION_ID: ${{ inputs.reservation_id }}
          BRANCH: ${{ inputs.branch }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          STATE: ${{ inputs.state }}
          LOGS: ${{ inputs.logs }}
          CONTROL_DIR: ${{ inputs.control_dir }}
          OUTPUT_ROOT: ${{ inputs.output_root }}
          ERROR_DETAIL: ${{ inputs.error }}
          NOTIFY_EMAIL: ${{ secrets.CS10_QUEUE_NOTIFY_EMAIL }}
          GMAIL_USERNAME: ${{ secrets.CS10_QUEUE_GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.CS10_QUEUE_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = ("NOTIFY_EMAIL", "GMAIL_USERNAME", "GMAIL_APP_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError("required Gmail notification secret is unavailable")

          event_type = os.environ["EVENT_TYPE"]
          fields = (
              ("reservation", os.environ.get("RESERVATION_ID", "")),
              ("branch", os.environ.get("BRANCH", "")),
              ("commit", os.environ.get("COMMIT_SHA", "")),
              ("state", os.environ.get("STATE", "")),
              ("logs", os.environ.get("LOGS", "")),
              ("control_dir", os.environ.get("CONTROL_DIR", "")),
              ("output_root", os.environ.get("OUTPUT_ROOT", "")),
              ("error", os.environ.get("ERROR_DETAIL", "")),
          )
          body = "\n".join(f"{name}={value}" for name, value in fields if value)

          message = EmailMessage()
          message["Subject"] = f"[cs10 queue] {event_type}"
          message["From"] = os.environ["GMAIL_USERNAME"]
          message["To"] = os.environ["NOTIFY_EMAIL"]
          message.set_content(body or "No queued reservations remain.")

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context) as smtp:
              smtp.login(os.environ["GMAIL_USERNAME"], os.environ["GMAIL_APP_PASSWORD"])
              smtp.send_message(message)
          PY
