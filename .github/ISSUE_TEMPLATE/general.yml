name: General Issue
description: バグ報告・改善提案・タスク管理
title: "[Issue] "
labels: ["execution:triage"]
body:
  - type: textarea
    id: objective
    attributes:
      label: 概要・目的
      description: このIssueで達成したいことを1-3行で記載してください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 必要な理由、経緯、現状の課題、再現条件を記載してください。
  - type: dropdown
    id: execution_target
    attributes:
      label: Heavy/runtime execution target
      description: コード実装・短時間unit testは通常Macです。この選択は長時間simulation、sweep、render等の実行先です。
      options:
        - mac_only
        - cs10_user_run
        - no_runtime
        - triage_required
    validations:
      required: true
  - type: input
    id: independent_conditions
    attributes:
      label: 独立condition数の見積り
      description: runtime不要なら N/A。不明なら unknown。8以上はcs10選択の必須候補です。
      placeholder: "例: 27"
    validations:
      required: true
  - type: input
    id: mac_wall_time
    attributes:
      label: Macでのwall time見積り
      description: runtime不要なら N/A。不明なら unknown。30分超はcs10選択の必須候補です。
      placeholder: "例: 4 hours"
    validations:
      required: true
  - type: dropdown
    id: cs10_execution_mode
    attributes:
      label: cs10 execution mode
      description: cs10_user_runでは独立2 condition以上をparallelとする。runtime不要またはcs10以外では N/A。
      options:
        - parallel
        - serial_exception
        - N/A
    validations:
      required: true
  - type: input
    id: parallel_job_config
    attributes:
      label: Parallel job config path
      description: parallel時は conf/phase2_parallel/<job>/job.yaml。該当しない場合は N/A。
      placeholder: "例: conf/phase2_parallel/issue123/job.yaml"
    validations:
      required: true
  - type: input
    id: parallel_worker_plan
    attributes:
      label: Parallel worker plan
      description: parallel時は worker数と cs10_qualified を記載。該当しない場合は N/A。
      placeholder: "例: 3 workers, cs10_qualified"
    validations:
      required: true
  - type: input
    id: serial_exception_approval_url
    attributes:
      label: Serial exception approval URL
      description: serial_exception時は、技術理由を記したrunbookと開始前のUser Issue-comment承認URL。該当しない場合は N/A。
      placeholder: "例: https://github.com/OWNER/REPO/issues/123#issuecomment-123"
    validations:
      required: true
  - type: dropdown
    id: roadmap_category
    attributes:
      label: Roadmap category (Milestone)
      description: Project #8 の Roadmap で表示する責務カテゴリを選択してください。
      options:
        - Phase 1 — Foundations
        - Phase 2 — Simulation & Pseudo-microscopy
        - Phase 2→3 — Video Handoff
        - Phase 2→4 — Dataset & Model Selection
        - Phase 3 — Cell Clips
        - Phase 3→4 — Clip Dataset & Learning
        - Phase 4 — Estimation Model
        - Project & Operations
    validations:
      required: true
  - type: input
    id: planned_target_date
    attributes:
      label: Planned target date
      description: 任意。予定終了日を JST の YYYY-MM-DD で指定してください。未指定のまま close された場合は終了日を設定します。
      placeholder: "例: 2026-09-30"
  - type: textarea
    id: details
    attributes:
      label: 詳細・受入条件
      description: 仕様、実装方針、実行予算、受入条件、User reviewを記載してください。
  - type: textarea
    id: references
    attributes:
      label: 関連項目
      value: |
        - 関連Issue:
        - 関連PR:
        - 関連ドキュメント:
