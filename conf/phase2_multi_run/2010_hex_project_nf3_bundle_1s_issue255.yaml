kind: generic_multi_run
metadata:
  role: sweep
  canonical: false
  description: 'Issue #255 nf3 slots024; frame position restoring x motor transverse
    correction; analytic torsion.'
  source_issue: https://github.com/Kenta-morimori/prj-flagella-estimation/issues/255
  model_id: 2010_hex_project_issue255_nf3_bundle
development_evaluation:
  version: 1
  profile_id: 2010_hex_project
  stage: long_duration
  expected_condition_count: 4
  axes:
  - attachment_pattern
  qc:
    exclude_diagnostics_from_gate:
    - hook_angle_err_max_deg
    required_gates:
    - finite
    - shape_body
    - hook_length
    - flag
    - motor
    max_motor_force_balance_residual_ratio: 1.0e-08
    max_motor_torque_balance_residual_ratio: 0.02
  accepted_source_campaigns:
  - conf/phase2_multi_run/2010_hex_project_nf3_bundle_1s_issue255.yaml
  replay:
    group_by:
    - n_flagella
    - attachment_pattern
    camera_3d: fixed
    view_range_mode: campaign-envelope
    show_flagella_axes: true
  long_duration:
    status: requires_short_screen_review
    feature_evaluation: separate_issue
  short_screen_source_campaign: conf/phase2_multi_run/2010_hex_project_nf3_bundle_1tau_issue255.yaml
base_config: conf/sim_swim_2010_hex.yaml
base_overrides:
  time.duration:
    value: 25.0
    unit: tau
  time.scale_policy: reference_torque
  time.integration.dt_star: 0.0001
  motor.torque_Nm: 2.5e-20
  motor.reference_torque_Nm: 2.5e-20
  motor.enable_switching: false
  motor.body_reaction_full_vector: true
  motor.body_reaction_support: attach_one_ring
  brownian.enabled: false
  potentials.spring_spring_repulsion.body_flagella_enabled: false
  flagella.placement_mode: explicit_center_layer_slots
  flagella.initial_hook_force_neutral: true
  flagella.initial_hook_body_axis_perpendicular: true
  seed.attach_seed: 0
  seed.phase_seed: 0
  output.policy: compact
  output.archive_interval_s: 0.001
  motor.attach_frame_reaction: energy_gradient
  motor.segment_torque_correction: minimum_norm
  potentials.torsion.force_method: analytic
  output.rotation_diagnostics: true
sweep:
  axes:
    attachment_pattern:
      keys:
        n_flagella: flagella.n_flagella
        attachment_slots: flagella.attachment_slots
        motor_torque: motor.torque_Nm
        frame_position_scale: motor.local_attach_frame_position_scale
        torque_correction: motor.segment_torque_correction
      short_name: mechanics
      values:
      - n_flagella: 3
        attachment_slots:
        - 0
        - 2
        - 4
        motor_torque: 2.5e-20
        frame_position_scale: 1.25
        torque_correction: none
      - n_flagella: 3
        attachment_slots:
        - 0
        - 2
        - 4
        motor_torque: 2.5e-20
        frame_position_scale: 1.25
        torque_correction: minimum_norm
      - n_flagella: 3
        attachment_slots:
        - 0
        - 2
        - 4
        motor_torque: 2.5e-20
        frame_position_scale: 1.0
        torque_correction: none
      - n_flagella: 3
        attachment_slots:
        - 0
        - 2
        - 4
        motor_torque: 2.5e-20
        frame_position_scale: 1.0
        torque_correction: minimum_norm
      labels:
      - 'A: frame=1.25; correction=OFF'
      - 'B: frame=1.25; correction=ON'
      - 'C: frame=1.0; correction=OFF'
      - 'D: frame=1.0; correction=ON'
      ids:
      - nf03__slots024__A
      - nf03__slots024__B
      - nf03__slots024__C
      - nf03__slots024__D
output:
  base_dir: outputs
  timestamp_subdir: true
  save_state_archive: true
  progress_interval: 1000
