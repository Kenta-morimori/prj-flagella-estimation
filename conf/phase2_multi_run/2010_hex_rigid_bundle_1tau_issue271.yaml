kind: generic_multi_run
metadata:
  role: sweep
  canonical: false
  source_issue: https://github.com/Kenta-morimori/prj-flagella-estimation/issues/271
  model_id: 2010_hex_rigid_common_bundle
  description: 全べん毛が後方束を作るRUNの形状保存候補。短期QCのみ。
development_evaluation:
  version: 1
  profile_id: 2010_hex_project
  stage: short_screen
  expected_condition_count: 5
  axes: [geometry]
  qc:
    exclude_diagnostics_from_gate: [hook_angle_err_max_deg]
    required_gates: [finite, shape_body, hook_length, flag, motor]
    max_motor_force_balance_residual_ratio: 1.0e-08
    max_motor_torque_balance_residual_ratio: 0.02
  accepted_source_campaigns:
    - conf/phase2_multi_run/2010_hex_rigid_bundle_1tau_issue271.yaml
  replay:
    group_by: [n_flagella, geometry]
    camera_3d: fixed
    view_range_mode: campaign-envelope
    show_flagella_axes: true
  long_duration:
    status: requires_short_screen_review
    feature_evaluation: separate_issue
base_config: conf/sim_swim_2010_hex.yaml
base_overrides:
  time.duration: {value: 1.0, unit: tau}
  time.scale_policy: reference_torque
  time.integration.dt_star: 0.0001
  motor.torque_Nm: 2.5e-20
  motor.reference_torque_Nm: 2.5e-20
  motor.enable_switching: false
  motor.body_reaction_full_vector: true
  motor.body_reaction_support: attach_one_ring
  motor.attach_frame_reaction: energy_gradient
  motor.local_attach_frame_position_scale: 1.0
  motor.segment_torque_correction: none
  motor.segment_torque_distribution: fixed_weights
  brownian.enabled: false
  potentials.spring_spring_repulsion.body_flagella_enabled: false
  potentials.torsion.force_method: analytic
  flagella.placement_mode: explicit_center_layer_slots
  flagella.initial_hook_force_neutral: false
  flagella.initial_hook_body_axis_perpendicular: false
  flagella.initial_bundle_mode: rigid_common_axis_rear
  flagella.initial_bundle_state_path: conf/phase2_initial/2010_hex_rigid_common_bundle_v1.json
  flagella.initial_bundle_state_sha256: 8844f37f5495ab66d19ab0a1c174e51c4bd42b8f1e6c837a85b3952981ca991d
  seed.attach_seed: 0
  seed.phase_seed: 0
  output.policy: compact
  output.archive_interval_s: 0.001
  output.rotation_diagnostics: true
sweep:
  axes:
    geometry:
      keys:
        n_flagella: flagella.n_flagella
        attachment_slots: flagella.attachment_slots
        variant: flagella.initial_bundle_variant
        motor_torque: motor.torque_Nm
      short_name: geometry
      values:
        - {n_flagella: 1, attachment_slots: [0], variant: base, motor_torque: 2.5e-20}
        - {n_flagella: 2, attachment_slots: [0, 2], variant: base, motor_torque: 2.5e-20}
        - {n_flagella: 3, attachment_slots: [0, 2, 4], variant: base, motor_torque: 2.5e-20}
        - {n_flagella: 6, attachment_slots: [0, 1, 2, 3, 4, 5], variant: base, motor_torque: 2.5e-20}
        - {n_flagella: 3, attachment_slots: [0, 2, 4], variant: hook_axis_tilt_1deg_flag0, motor_torque: 2.5e-20}
      ids:
        - nf01__slots0__base
        - nf02__slots02__base
        - nf03__slots024__base
        - nf06__slots012345__base
        - nf03__slots024__tilt1deg
output:
  base_dir: outputs
  timestamp_subdir: true
  save_state_archive: true
  progress_interval: 1000
