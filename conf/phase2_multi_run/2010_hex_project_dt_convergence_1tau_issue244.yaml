kind: generic_multi_run
metadata:
  role: sweep
  canonical: false
  description: Issue #244 2010 hex project n3/n6 1tau dt convergence check.
  source_issue: https://github.com/Kenta-morimori/prj-flagella-estimation/issues/244
  model_id: 2010_hex_project_issue244
  model_notes:
    - Requires the 54-condition seed grid to pass before user-run execution.
    - Fixed screen candidate: T=2.5e-20 N m per flagellum.

base_config: conf/sim_swim_2010_hex.yaml

base_overrides:
  time.duration: {value: 1.0, unit: tau}
  time.scale_policy: reference_torque
  motor.torque_Nm: 2.5e-20
  motor.reference_torque_Nm: 2.5e-20
  motor.enable_switching: false
  brownian.enabled: false
  output.policy: compact
  output.archive_interval_s: 0.001
  seed.attach_seed: 0
  seed.phase_seed: 0

sweep:
  axes:
    n_flagella:
      key: flagella.n_flagella
      short_name: nf
      values: [3, 6]
      labels: ["3", "6"]
      ids: [nf03, nf06]
    dt_star:
      key: time.integration.dt_star
      short_name: dt
      values: [1.0e-4, 5.0e-5]
      labels: ["1e-4", "5e-5"]
      ids: [dt1e4, dt5e5]

output:
  base_dir: outputs
  timestamp_subdir: true
  save_state_archive: true
  progress_interval: 1000
