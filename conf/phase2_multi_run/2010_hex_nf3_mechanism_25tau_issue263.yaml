kind: generic_multi_run
metadata:
  role: sweep
  canonical: false
  source_issue: https://github.com/Kenta-morimori/prj-flagella-estimation/issues/263
  model_id: 2010_hex_issue263_nf3_mechanisms
  description: Parallel nf3 one-change-at-a-time 25-tau mechanism observation checkpoint.
development_evaluation:
  version: 1
  profile_id: 2010_hex_project
  stage: long_duration
  expected_condition_count: 5
  axes: [mechanism]
  qc:
    exclude_diagnostics_from_gate: [hook_angle_err_max_deg]
    required_gates: [finite, shape_body, hook_length, flag, motor]
    max_motor_force_balance_residual_ratio: 1.0e-08
    max_motor_torque_balance_residual_ratio: 0.02
  accepted_source_campaigns:
    - conf/phase2_multi_run/2010_hex_nf3_mechanism_25tau_issue263.yaml
  replay:
    group_by: [n_flagella, mechanism]
    camera_3d: fixed
    view_range_mode: campaign-envelope
    show_flagella_axes: true
  long_duration:
    duration_s: 1.0
    reference_tau: 25
    expected_steps: 250000
    feature_evaluation: separate_issue
base_config: conf/sim_swim_2010_hex.yaml
base_overrides:
  time.duration: {value: 25.0, unit: tau}
  time.scale_policy: reference_torque
  time.integration.dt_star: 0.0001
  motor.torque_Nm: 2.5e-20
  motor.reference_torque_Nm: 2.5e-20
  motor.enable_switching: false
  motor.body_reaction_full_vector: true
  motor.body_reaction_support: attach_one_ring
  motor.attach_frame_reaction: energy_gradient
  motor.local_attach_frame_position_scale: 1.0
  motor.segment_torque_correction: none
  motor.segment_torque_distribution: fixed_weights
  brownian.enabled: false
  potentials.spring_spring_repulsion.body_flagella_enabled: false
  potentials.torsion.force_method: analytic
  flagella.placement_mode: explicit_center_layer_slots
  flagella.n_flagella: 3
  flagella.attachment_slots: [0, 2, 4]
  flagella.initial_hook_force_neutral: true
  flagella.initial_hook_body_axis_perpendicular: true
  flagella.initial_phase_offsets_deg: [0, 0, 0]
  seed.attach_seed: 0
  seed.phase_seed: 0
  output.policy: compact
  output.archive_interval_s: 0.001
  output.rotation_diagnostics: true
sweep:
  axes:
    mechanism:
      keys:
        bundle_mode: flagella.initial_bundle_mode
        frame_position_scale: motor.local_attach_frame_position_scale
        torque_correction: motor.segment_torque_correction
        torque_distribution: motor.segment_torque_distribution
      short_name: mechanism
      values:
        - {bundle_mode: none, frame_position_scale: 1.0, torque_correction: none, torque_distribution: fixed_weights}
        - {bundle_mode: compact_rear, frame_position_scale: 1.0, torque_correction: none, torque_distribution: fixed_weights}
        - {bundle_mode: compact_rear, frame_position_scale: 1.0, torque_correction: none, torque_distribution: arm_weighted_minimum_norm}
        - {bundle_mode: compact_rear, frame_position_scale: 1.25, torque_correction: none, torque_distribution: fixed_weights}
        - {bundle_mode: compact_rear, frame_position_scale: 1.0, torque_correction: minimum_norm, torque_distribution: fixed_weights}
      labels: [C control, compact control, compact arm-weighted motor, compact restored frame, compact transverse-torque correction]
      ids: [nf03__slots024__C, nf03__slots024__bundle, nf03__slots024__arm_weighted, nf03__slots024__frame_125, nf03__slots024__torque_corrected]
output:
  base_dir: outputs
  timestamp_subdir: true
  save_state_archive: true
  progress_interval: 1000
