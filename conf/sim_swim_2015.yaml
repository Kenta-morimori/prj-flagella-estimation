# Kong et al. (2015) refined modelを基礎にするproject採用候補。
# 初期candidateはpaper profileと同じ物理値を持ち、project固有補強は未採用。
# #166/#167/#168の実装・安定性評価後にpaper profileとの差分を決定する。

model_profile:
  year: 2015
  variant: project
  resolution: refined
  implementation_status: pending
  body_beads: 30
  flagellum_beads_per_filament: 30
  nominal_flagella_count: 3
  nominal_total_beads: 120

scale:
  b_um: 1.0
  bead_radius_a_over_b: 0.06

body:
  prism:
    # Fig. 1、30 beads、5 layersと整合する正六角形x5層（論文不整合へのproject推論）。
    n_prism: 6
    dz_over_b: 0.5
    radius_over_b: 0.5
    axis: "x"
  length_total_um: 2.0

flagella:
  n_flagella: 3
  placement_mode: "seeded_surface"
  initial_phase_mode: "seeded"
  init_mode: "paper_table1"
  n_beads_per_flagellum: 30
  discretization:
    ds_over_b: 0.29
  bond_L_over_b: 0.29
  length_over_b: 8.41
  helix_init:
    radius_over_b: 0.25
    pitch_over_b: 2.5
  initial_helix_axis_from_rear_deg: null

fluid:
  viscosity_Pa_s: 0.001

motor:
  enabled: true
  torque_Nm: 1.2e-18
  reference_torque_Nm: 1.2e-18
  # project比較用の現行torque transmission。paper profileとの差分を維持する。
  force_distribution: "root_torque_segment_couples"
  torque_distribution_profile: "diffusive"
  reverse_n_flagella: 1
  enable_switching: false
  local_hook_scale: 1.0
  local_spring_scale: 1.0
  local_attach_first_spring_scale: 1.0
  local_attach_first_body_axis_angle_scale: 1.0
  local_first_second_spring_scale: 1.0
  local_attach_frame_position_scale: 1.0
  local_attach_frame_tangent_scale: 1.0
  local_attach_frame_tangent_mode: "vector"
  local_bend_scale: 1.0
  local_torsion_scale: 1.0

potentials:
  spring:
    formulation: "fene_fraenkel"
    H_over_T_over_b: 1000.0
    s: 0.1
  bend:
    kb_over_T: 30.0
    theta0_deg:
      normal: 161.0
      semicoiled: 138.0
      curly1: 142.0
  torsion:
    kt_over_T: 5.0
    fd_eps_over_b: 1e-3
    phi0_deg:
      normal: -30.0
      semicoiled: 32.5
      curly1: 60.0
  spring_spring_repulsion:
    A_ss_over_T: 1.0
    a_ss_over_b: 0.2
    cutoff_over_b: 0.2

hook:
  enabled: true
  threshold_deg: 90.0
  kb_over_T: 30.0

# diagonal brace制御と中央層slot geometryは#166まで未実装。
body_equiv_load:
  enabled: false
  mode: "none"
  target_torque_Nm: 0.0
  target_force_N: 0.0
  attach_region_id: 0

run_tumble:
  run_tau: 1200.0
  tumble_tau: 800.0
  semicoiled_tau: 400.0
  curly1_tau: 400.0

time:
  duration:
    value: 1.0
    unit: tau
  dt_s: 1.0e-3                 # [s] deprecated: 出力・記録間隔。内部積分刻みではない
  integration:
    dt_star: 1.0e-5

output_sampling:
  out_all_steps_3d: false
  fps_out_3d: 25.0
  fps_out_2d: 25.0

brownian:
  enabled: false
  temperature_K: 298.0
  method: "cholesky"
  jitter: 1.0e-20

render:
  image_size_px: 256
  pixel_size_um: 0.203
  flagella_linewidth_px: 2.0
  render_flagella: true
  render_flagella_2d: false
  save_frames_3d: false
  follow_camera_3d: true
  view_range_um: 5.0
  timestamp_3d: true
  timestamp_fmt: "t = {t:.3f} s"
  label_flagella: true
  show_flagella_helix_axis_3d: false
  follow_camera_2d: false
  center_body_in_2d: true
  save_frames_2d: false

seed:
  global_seed: 0
  attach_seed: null
  phase_seed: null

output:
  base_dir: outputs
  timestamp_subdir: true
